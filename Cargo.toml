[package]
name = "lockpick"
version = "0.7.0"
edition = "2024"
description = "Run every Rust quality gate in one command"
repository = "https://github.com/Kuenlun/lockpick"
authors = ["Juan Luis Leal Contreras <kuenlunleal@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["cli", "ci", "quality", "lint", "merge-check"]
categories = ["development-tools", "command-line-utilities"]

# Self-hosted lockpick configuration.
[package.metadata.lockpick]
license-header = ".github/license_header.rs"
locked = true

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap-cargo = { version = "0.18", default-features = false, features = ["clap"] }
clap_complete = "4"
colored = "3"
glob = "0.3"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Unix-only: SIGINT/SIGTERM capture so a Ctrl-C (or `kill -INT`) mid-pipeline
# yields the canonical `128 + signum` exit code instead of being misread as
# a check failure. Children get the same signal forwarded via `kill(1)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_op_in_unsafe_fn = "forbid"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_results = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
