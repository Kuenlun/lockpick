name: Rust

on:
  pull_request:
  push:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
          targets: thumbv8m.main-none-eabihf
      - name: Install external check tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-nextest@0.9.145
      - name: Build lockpick from this commit
        run: cargo build --release --locked
      - name: Run lockpick on itself
        run: ./target/release/lockpick -v

  coverage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-14
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      NEXTEST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-14
          components: rustfmt, clippy, llvm-tools-preview
          targets: thumbv8m.main-none-eabihf
      - name: Install external check tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-nextest@0.9.145
      # Keep Windows tests under PowerShell. MSYS2 enables privileges that bypass file ACLs.
      - name: Build Lockpick outside its measurement directory
        run: cargo build --release --locked --target-dir ../lockpick-bootstrap
      - name: Require complete coverage with Lockpick
        run: ../lockpick-bootstrap/release/lockpick --coverage -v
      - name: Export existing coverage
        if: always()
        run: |
          cargo llvm-cov report --branch --json --output-path coverage.json
          cargo llvm-cov report --branch --lcov --output-path lcov.info
      - name: Preserve coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage.json
            lcov.info
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          version: v11.3.1
          flags: ${{ runner.os }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  merge-gate:
    runs-on: ubuntu-latest
    needs: [check, coverage]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::Check failed: ${{ needs.check.result }}"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "::error::Coverage check failed: ${{ needs.coverage.result }}"
            exit 1
          fi
