name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build matrix only: skip release-plz, skip crates.io, skip asset upload"
        type: boolean
        default: false

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1

      - name: Run release-plz
        id: release-plz
        uses: MarcoIeni/release-plz-action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Extract tag name
        id: extract-tag
        if: steps.release-plz.outputs.releases_created == 'true'
        run: |
          TAG=$(echo '${{ steps.release-plz.outputs.releases }}' | jq -r '.[0].tag')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  upload-assets:
    name: Upload Binaries (${{ matrix.target }})
    needs: release-plz
    if: >-
      ${{
        !cancelled() && (
          (github.event_name == 'push' && needs.release-plz.result == 'success' && needs.release-plz.outputs.releases_created == 'true' && needs.release-plz.outputs.tag != '')
          || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        )
      }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            rustflags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-apple-darwin
            os: macos-latest
            rustflags: "-C target-cpu=apple-m1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install musl tools (dry-run, x86_64-linux-musl)
        if: >-
          ${{ github.event_name == 'workflow_dispatch'
              && inputs.dry_run
              && matrix.target == 'x86_64-unknown-linux-musl' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (aarch64-linux-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cross@0.2.5

      - name: Dry-run build (cross)
        if: >-
          ${{ github.event_name == 'workflow_dispatch'
              && inputs.dry_run
              && matrix.target == 'aarch64-unknown-linux-musl' }}
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cross build --release --locked --target ${{ matrix.target }} --bin lockpick

      - name: Dry-run build (cargo)
        if: >-
          ${{ github.event_name == 'workflow_dispatch'
              && inputs.dry_run
              && matrix.target != 'aarch64-unknown-linux-musl' }}
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin lockpick

      - name: Install Rust toolchain (release)
        if: github.event_name == 'push'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install musl tools (release, x86_64-linux-musl)
        if: >-
          ${{ github.event_name == 'push'
              && matrix.target == 'x86_64-unknown-linux-musl' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Upload binaries to release
        if: github.event_name == 'push'
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          bin: lockpick
          locked: true
          target: ${{ matrix.target }}
          ref: refs/tags/${{ needs.release-plz.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
